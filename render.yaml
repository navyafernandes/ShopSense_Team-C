services:
  # ----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: shopsense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,https://shopsense-frontend.onrender.com

  # ----------------------------------------------------
  # 2. React / Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: shopsense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://shopsense-backend.onrender.com

databases:
  # ----------------------------------------------------
  # 3. PostgreSQL Managed Database
  # ----------------------------------------------------
  - name: shopsense-db
    databaseName: shopsense
    plan: free